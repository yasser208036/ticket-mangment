# Local development services.
#
#   docker compose up -d          start MySQL + Mailpit
#   docker compose down           stop (data survives)
#   docker compose down -v        stop and wipe the database
#
# The Laravel app and the Vue dev server run on the host and connect to these.

services:
  mysql:
    image: mysql:8.4
    container_name: tm-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ticket_management}
      MYSQL_USER: ${DB_USERNAME:-ticket_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      # utf8mb4 throughout so ticket subjects and descriptions accept Arabic and emoji.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-root_secret}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # A second database used only by the test suite, so running tests never
  # truncates the data you are developing against.
  mysql-test:
    image: mysql:8.4
    container_name: tm-mysql-test
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ticket_management_test
      MYSQL_USER: ${DB_USERNAME:-ticket_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    ports:
      - '${DB_TEST_PORT:-3307}:3306'
    volumes:
      - mysql-test-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWORD:-root_secret}']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Catches every outgoing email in development. Nothing can reach a real inbox.
  mailpit:
    image: axllent/mailpit:latest
    container_name: tm-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'   # SMTP — Laravel sends here
      - '${MAILPIT_UI_PORT:-8025}:8025'     # Web UI — read the mail here
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  mysql-data:
  mysql-test-data:
